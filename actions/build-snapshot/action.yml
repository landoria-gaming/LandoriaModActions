name: Build snapshot
description: Build and package through MSBuild, with Bash orchestration
inputs:
  project-file:
    description: Mod project file relative to repository root
    required: true
  mod-name:
    description: Mod assembly name
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        PROJECT_FILE: ${{ inputs.project-file }}
        MOD_NAME: ${{ inputs.mod-name }}
      run: bash "$(cygpath -u "$ACTION_DIRECTORY")/../../tools/build-snapshot.sh"
