name: Check snapshot versions
description: Skip unless source versions are identical snapshots
inputs:
  manifest-path:
    description: Package manifest path
    default: manifest.json
  assembly-info-path:
    description: AssemblyInfo source path
    default: Properties/AssemblyInfo.cs
outputs:
  eligible:
    description: Whether the mod declares a matching snapshot version
    value: ${{ steps.check.outputs.eligible }}
runs:
  using: composite
  steps:
    - name: Compare snapshot versions
      id: check
      env:
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        ASSEMBLY_INFO_PATH: ${{ inputs.assembly-info-path }}
      shell: pwsh
      run: |
        $eligible = $false
        try {
          $manifest = Get-Content -LiteralPath $env:MANIFEST_PATH -Raw | ConvertFrom-Json
          $assemblyInfo = Get-Content -LiteralPath $env:ASSEMBLY_INFO_PATH -Raw
          $assemblyVersionMatches = [regex]::Matches($assemblyInfo, '(?m)^\s*\[assembly:\s*AssemblyInformationalVersion\("([^"]+)"\)\]')
          $eligible = $assemblyVersionMatches.Count -eq 1 -and
            $manifest.version_number -cmatch '^\d+\.\d+\.\d+-snapshot$' -and
            $manifest.version_number -ceq $assemblyVersionMatches[0].Groups[1].Value
        } catch {
          Write-Host "Snapshot metadata could not be read: $_"
        }
        "eligible=$($eligible.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        if (-not $eligible) {
          'Snapshot skipped: AssemblyInformationalVersion and version_number must be identical and end with -snapshot.' >> $env:GITHUB_STEP_SUMMARY
        }
