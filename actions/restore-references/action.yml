name: Restore shared compilation references
description: Refresh references on demand in the private store, then validate and configure them
inputs:
  references-repository:
    description: Private reference repository
    default: landoria-gaming/LandoriaModReferences
  token:
    description: Dedicated Actions write token restricted to the private reference repository
    required: true
runs:
  using: composite
  steps:
    - name: Check shared references on demand
      id: references
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.token }}
        REFERENCE_REPOSITORY: ${{ inputs.references-repository }}
      run: bash "$(cygpath -u "$ACTION_DIRECTORY")/../../tools/request-references.sh" "$REFERENCE_REPOSITORY"
    - name: Download validated shared bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node.js 24)
      with:
        repository: ${{ inputs.references-repository }}
        github-token: ${{ inputs.token }}
        run-id: ${{ steps.references.outputs.run-id }}
        name: mod-compilation-references
        path: ${{ runner.temp }}/shared-references
    - name: Validate and configure references
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        REFERENCE_RUN_ID: ${{ steps.references.outputs.run-id }}
      run: bash "$(cygpath -u "$ACTION_DIRECTORY")/../../tools/configure-references.sh"
