name: Cache compilation references
description: Download validate and cache Valheim and BepInEx compilation DLLs
inputs:
  config-path:
    description: Reference configuration JSON in the caller repository
    default: build/valheim-references.json
runs:
  using: composite
  steps:
    - name: Read reference configuration
      id: config
      env:
        REFERENCE_CONFIG: ${{ inputs.config-path }}
      shell: pwsh
      run: |
        $config = Get-Content -LiteralPath $env:REFERENCE_CONFIG -Raw | ConvertFrom-Json
        "key=valheim-managed-windows-$($config.version)-r$($config.cache_revision)" >> $env:GITHUB_OUTPUT
        "bepinex-key=bepinex-valheim-$($config.bepinex_version)-r$($config.cache_revision)" >> $env:GITHUB_OUTPUT

    - name: Restore existing references
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/valheim-references
        key: ${{ steps.config.outputs.key }}

    - name: Set up .NET SDK
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: '10.0.x'

    # Adapted from LandoriaModsAutomation's Store Valheim managed DLLs.
    - name: Download and validate Valheim managed DLLs
      if: steps.cache.outputs.cache-hit != 'true'
      env:
        REFERENCE_CONFIG: ${{ inputs.config-path }}
        ACTION_DIRECTORY: ${{ github.action_path }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $config = Get-Content -LiteralPath $env:REFERENCE_CONFIG -Raw | ConvertFrom-Json
        $steamcmd = Join-Path $env:RUNNER_TEMP 'steamcmd'
        $server = Join-Path $env:RUNNER_TEMP 'valheim-reference-source'
        $references = Join-Path $env:RUNNER_TEMP 'valheim-references'
        $managed = Join-Path $references 'valheim_Data/Managed'
        New-Item -ItemType Directory -Path $steamcmd, $managed -Force | Out-Null
        Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile "$env:RUNNER_TEMP/steamcmd.zip"
        Expand-Archive -LiteralPath "$env:RUNNER_TEMP/steamcmd.zip" -DestinationPath $steamcmd
        & "$steamcmd/steamcmd.exe" +@ShutdownOnFailedCommand 1 +@NoPromptForPassword 1 +force_install_dir $server +login anonymous +app_update $config.steam_app_id -beta $config.steam_beta validate +quit
        if ($LASTEXITCODE -ne 0) { throw "SteamCMD failed with exit code $LASTEXITCODE." }
        $sourceManaged = Join-Path $server 'valheim_server_Data/Managed'
        dotnet build "$env:ACTION_DIRECTORY/../../tools/ValheimGameVersion/ValheimGameVersion.csproj" -c Release --nologo
        if ($LASTEXITCODE -ne 0) { throw 'Version reader build failed.' }
        $actualVersion = dotnet "$env:ACTION_DIRECTORY/../../tools/ValheimGameVersion/bin/Release/net10.0/ValheimGameVersion.dll" "$sourceManaged/assembly_valheim.dll"
        if ($LASTEXITCODE -ne 0 -or $actualVersion -ne $config.version) {
          throw "Downloaded Valheim version $actualVersion does not match expected $($config.version)."
        }
        Copy-Item -Path "$sourceManaged/*.dll" -Destination $managed
        Copy-Item -LiteralPath "$server/steamapps/appmanifest_$($config.steam_app_id).acf" -Destination "$references/valheim-appmanifest.acf"
        $files = @(Get-ChildItem -LiteralPath $managed -Filter '*.dll' | ForEach-Object {
          [ordered]@{ name = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
        })
        [ordered]@{ version = $actualVersion; files = $files } | ConvertTo-Json -Depth 4 |
          Set-Content -LiteralPath "$references/build-references.json" -Encoding utf8

    - name: Save managed DLLs in GitHub cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/valheim-references
        key: ${{ steps.config.outputs.key }}

    - name: Restore BepInEx references
      id: bepinex
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/bepinex-references
        key: ${{ steps.config.outputs.bepinex-key }}

    - name: Download and validate BepInEx references
      if: steps.bepinex.outputs.cache-hit != 'true'
      env:
        REFERENCE_CONFIG: ${{ inputs.config-path }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $config = Get-Content -LiteralPath $env:REFERENCE_CONFIG -Raw | ConvertFrom-Json
        $references = Join-Path $env:RUNNER_TEMP 'bepinex-references'
        $core = Join-Path $references 'BepInEx/core'
        New-Item -ItemType Directory -Path $core -Force | Out-Null
        Invoke-WebRequest "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/$($config.bepinex_version)/" -OutFile "$env:RUNNER_TEMP/bepinex.zip"
        Expand-Archive -LiteralPath "$env:RUNNER_TEMP/bepinex.zip" -DestinationPath "$env:RUNNER_TEMP/bepinex-package"
        $files = @(foreach ($name in 'BepInEx.dll', '0Harmony.dll') {
          $source = Join-Path $env:RUNNER_TEMP "bepinex-package/BepInExPack_Valheim/BepInEx/core/$name"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf) -or (Get-Item -LiteralPath $source).Length -eq 0) {
            throw "Missing or empty BepInEx reference: $name"
          }
          Copy-Item -LiteralPath $source -Destination $core
          [ordered]@{ name = $name; sha256 = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash }
        })
        [ordered]@{ version = $config.bepinex_version; files = $files } | ConvertTo-Json -Depth 4 |
          Set-Content -LiteralPath "$references/build-references.json" -Encoding utf8

    - name: Save BepInEx references in GitHub cache
      if: steps.bepinex.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/bepinex-references
        key: ${{ steps.config.outputs.bepinex-key }}

    - name: Report cache size
      env:
        REFERENCE_CONFIG: ${{ inputs.config-path }}
      shell: pwsh
      run: |
        $files = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/valheim-references" -Recurse -File
        $size = [math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB, 2)
        "Managed reference cache: $($files.Count) files, $size MiB. SteamCMD and the rest of the server are not cached." >> $env:GITHUB_STEP_SUMMARY
        $bepinexFiles = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/bepinex-references" -Recurse -File
        $bepinexSize = [math]::Round(($bepinexFiles | Measure-Object Length -Sum).Sum / 1MB, 2)
        "BepInEx reference cache: $($bepinexFiles.Count) files, $bepinexSize MiB. Only BepInEx.dll, 0Harmony.dll and metadata are cached." >> $env:GITHUB_STEP_SUMMARY
