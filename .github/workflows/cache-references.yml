name: Cache compilation dependencies
on:
  workflow_call:
    inputs:
      config-path:
        type: string
        default: build/valheim-references.json
permissions:
  contents: read
jobs:
  cache:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    concurrency:
      group: cache-compilation-dependencies
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: landoria-gaming/LandoriaModActions/actions/cache-references@v1
        with:
          config-path: ${{ inputs.config-path }}
